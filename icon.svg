<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#2a1f6e"/>
      <stop offset=".45" stop-color="#120c3a"/>
      <stop offset="1" stop-color="#03030f"/>
    </radialGradient>
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3fb4" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ff3fb4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2fd6ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#2fd6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d6" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ffcf5a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="450">
      <stop offset="0" stop-color="#7ef9ff"/>
      <stop offset=".45" stop-color="#ff5fd2"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd6ff" stop-opacity="0"/>
      <stop offset=".3" stop-color="#7ef9ff"/>
      <stop offset=".7" stop-color="#ff5fd2"/>
      <stop offset="1" stop-color="#ff5fd2" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
    <clipPath id="tile"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <ellipse cx="150" cy="150" rx="190" ry="140" fill="url(#neb1)" filter="url(#soft)"/>
    <ellipse cx="380" cy="380" rx="200" ry="150" fill="url(#neb2)" filter="url(#soft)"/>
    <g fill="#fff">
      <circle cx="70" cy="90" r="2.4"/><circle cx="430" cy="70" r="3"/><circle cx="460" cy="190" r="1.8"/><circle cx="90" cy="300" r="1.6"/>
      <circle cx="400" cy="300" r="2"/><circle cx="60" cy="430" r="2.6"/><circle cx="330" cy="460" r="1.6"/><circle cx="190" cy="60" r="1.6"/>
      <circle cx="120" cy="210" r="1.4"/><circle cx="470" cy="420" r="2.2"/><circle cx="350" cy="120" r="1.4"/><circle cx="160" cy="470" r="1.8"/>
      <path d="M430 56 v28 M416 70 h28" stroke="#fff" stroke-width="1.6" opacity=".7"/>
      <path d="M70 418 v24 M58 430 h24" stroke="#fff" stroke-width="1.4" opacity=".6"/>
    </g>
    <circle cx="256" cy="282" r="130" fill="url(#halo)" opacity=".5"/>
    <!-- flow arc: energy from hand to hand -->
    <path d="M92 198 C 150 40, 362 40, 420 198" fill="none" stroke="url(#orbit)" stroke-width="6" stroke-linecap="round" opacity=".85" filter="url(#glow)"/>
    <path d="M110 214 C 170 92, 342 92, 402 214" fill="none" stroke="url(#orbit)" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>
    <!-- line of gravity -->
    <path d="M256 40 V478" stroke="#ffd84d" stroke-width="4" stroke-dasharray="10 12" opacity=".7"/>
    <!-- Warrior II -->
    <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="url(#body)">
      <path d="M214 206 C 170 202, 130 200, 92 198" stroke-width="21"/>
      <path d="M298 206 C 342 202, 382 200, 420 198" stroke-width="21"/>
      <path d="M244 302 C 210 350, 172 398, 126 444" stroke-width="27"/>
      <path d="M268 302 C 300 308, 330 314, 354 326" stroke-width="28"/>
      <path d="M354 326 C 356 362, 356 404, 358 444" stroke-width="24"/>
      <path d="M126 444 L 98 446 M358 444 L 388 446" stroke-width="13"/>
    </g>
    <path d="M206 194 Q 256 182 306 194 C 304 216, 294 236, 286 254 C 280 270, 278 286, 278 306 L 234 306 C 234 286, 232 270, 226 254 C 218 236, 208 216, 206 194 Z" fill="url(#body)" filter="url(#glow)"/>
    <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity=".5" stroke-width="2.4">
      <path d="M226 206 C 236 236, 246 262, 250 298"/><path d="M286 206 C 276 236, 266 262, 262 298"/><path d="M256 196 V 296"/>
      <path d="M208 198 C 168 194, 132 192, 104 190"/><path d="M304 198 C 344 194, 380 192, 408 190"/>
      <path d="M236 312 C 206 352, 174 392, 136 432"/><path d="M276 312 C 304 318, 328 324, 346 332"/><path d="M350 340 C 351 372, 351 404, 352 432"/>
    </g>
    <circle cx="90" cy="198" r="12" fill="#e9fdff" filter="url(#glow)"/>
    <circle cx="422" cy="198" r="12" fill="#e9fdff" filter="url(#glow)"/>
    <circle cx="262" cy="146" r="26" fill="#fff6ef" filter="url(#glow)"/>
    <circle cx="262" cy="146" r="26" fill="none" stroke="#7ef9ff" stroke-width="3" opacity=".8"/>
    <!-- center of mass -->
    <circle cx="256" cy="286" r="12" fill="#fff4c2" filter="url(#glow)"/>
    <circle cx="256" cy="286" r="21" fill="none" stroke="#ffd84d" stroke-width="3" opacity=".9"/>
    <!-- ground -->
    <path d="M70 452 H442" stroke="#7ef9ff" stroke-width="3" opacity=".45" filter="url(#glow)"/>
  </g>
</svg>
