<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#16294a"/>
      <stop offset="1" stop-color="#050a14"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7ac8"/>
      <stop offset=".5" stop-color="#e2344f"/>
      <stop offset="1" stop-color="#7a1426"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ef9ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="url(#ring)" stroke-width="2.4" stroke-dasharray="5 3.2" opacity=".9"/>
  <!-- tendons -->
  <path d="M15 49 L21 43 M43 21 L49 15" stroke="#f1ebdd" stroke-width="3.2" stroke-linecap="round"/>
  <!-- muscle belly -->
  <path d="M21 43 C 16 30, 30 16, 43 21 C 48 34, 34 48, 21 43 Z" fill="url(#belly)"/>
  <!-- fibers -->
  <path d="M23 40 C 21 31, 30 22, 40 22 M26 42 C 25 33, 33 25, 42 24.5 M30 43 C 30 35, 36 28, 43 28" fill="none" stroke="#ffd0e6" stroke-width="1" stroke-linecap="round" opacity=".75"/>
  <!-- highlight -->
  <path d="M24 37 C 23 30, 30 23, 37 22" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
  <!-- line of gravity -->
  <path d="M32 6 V58" stroke="#ffd84d" stroke-width="1.4" stroke-dasharray="2.5 2.5" opacity=".8"/>
  <circle cx="32" cy="32" r="3.2" fill="#ffd84d"/>
  <circle cx="32" cy="32" r="6" fill="#ffd84d" opacity=".25"/>
</svg>
